name: Frontend (build and deploy to Firebase Hosting)

# Builds on every PR and push that touches frontend/. Deploys: develop -> test project, master -> prod project.
# Deploys stay off until the repository variable CLOUD_DEPLOY is "on" (after the console setup, see the README).
on:
  push:
    branches: [develop, master]
    paths: ['frontend/**', 'firebase.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'firebase.json', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    if: >-
      vars.CLOUD_DEPLOY == 'on' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'test' }}
    concurrency:
      group: deploy-frontend-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - name: Deploy to Firebase Hosting
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: npx --yes firebase-tools@15.37.0 deploy --only hosting --project "$PROJECT" --non-interactive
