name: Deploy web to GitHub Pages

# One Pages site holds both apps: the frozen live app at the root and develop (test) under /test/.
# The root is built from the tag live-app-frozen (D64), not from master: master now also carries the new stack, and
# merging it must not change the old app the owner still uses until the switch-over.
# A push to either branch rebuilds the whole site, so neither wipes the other.
on:
  push:
    branches: [master, develop]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live-app-frozen
          path: live
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          path: test
          persist-credentials: false
      - name: Assemble the live site with the test copy under /test/
        run: |
          mkdir -p _site/test
          cp -r live/web/. _site/
          cp -r test/web/. _site/test/
          jq '.name = "Foodies Directory TEST" | .short_name = "Foodies TEST"' test/web/manifest.webmanifest > _site/test/manifest.webmanifest
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
