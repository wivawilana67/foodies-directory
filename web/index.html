<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Foodies">
  <title>Foodies Directory</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Foodies</h1>
    <nav>
      <button type="button" data-view="list">Places</button>
      <button type="button" data-view="add">Add</button>
      <button type="button" data-view="setup" aria-label="Settings">⚙</button>
    </nav>
  </header>

  <main>
    <section id="view-list" hidden>
      <div class="filters">
        <input id="search" type="search" placeholder="Search name, city, craving" aria-label="Search">
        <div class="row">
          <button id="near-me" type="button" class="button" aria-pressed="false">Near me</button>
          <select id="filter-category" aria-label="Craving"></select>
          <select id="filter-area" aria-label="City"></select>
        </div>
        <div class="row">
          <label id="filter-untried-wrap" hidden><input id="filter-untried" type="checkbox"> Not tried yet</label>
          <span id="count" class="muted"></span>
          <button id="refresh" type="button" class="button">Refresh</button>
        </div>
      </div>
      <p id="status" class="muted" role="status"></p>
      <ul id="places" class="cards"></ul>
    </section>

    <section id="view-add" hidden>
      <form id="add-form">
        <label for="add-input">Paste a Google Maps link or type a name</label>
        <textarea id="add-input" rows="3" placeholder="https://maps.app.goo.gl/…  or  Bakmi GM Bandung"></textarea>
        <div class="row">
          <button id="paste" type="button" class="button">Paste</button>
          <button type="submit" class="button primary">Look up</button>
        </div>
        <details>
          <summary>Your labels (optional)</summary>
          <label>Tipe <input id="label-tipe" maxlength="100"></label>
          <label>Genre <input id="label-genre" maxlength="100"></label>
          <label>Jenis <input id="label-jenis" maxlength="100"></label>
        </details>
      </form>
      <p id="add-status" class="muted" role="status"></p>
      <ul id="results" class="cards"></ul>
    </section>

    <section id="view-setup" hidden>
      <form id="setup-form">
        <p>Enter the backend URL and token once on this phone. They are stored only on this device.</p>
        <label>Backend URL <input id="setup-url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></label>
        <label>Token <input id="setup-token" type="password" autocomplete="off"></label>
        <button type="submit" class="button primary">Save and check</button>
      </form>
      <p id="setup-status" class="muted" role="status"></p>
    </section>
  </main>
</body>
</html>
